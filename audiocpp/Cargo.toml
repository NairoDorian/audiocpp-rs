[package]
name = "audiocpp"
description = "Safe Rust bindings to audio.cpp: local text-to-speech, voice cloning and speech models on ggml"
readme = "../README.md"
keywords = ["tts", "speech", "audio", "ggml", "voice"]
categories = ["api-bindings", "multimedia::audio"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
audiocpp-sys = { path = "../audiocpp-sys", version = "0.2.0", default-features = false }
log = { version = "0.4", optional = true }

[dev-dependencies]
hound = "3.5"

[features]
default = ["openmp", "metal"]
openmp = ["audiocpp-sys/openmp"]
native = ["audiocpp-sys/native"]
metal = ["audiocpp-sys/metal"]
vulkan = ["audiocpp-sys/vulkan"]
cuda = ["audiocpp-sys/cuda"]
hip = ["audiocpp-sys/hip"]
gpl-espeak = ["audiocpp-sys/gpl-espeak"]
all-models = ["audiocpp-sys/all-models"]
# Route audio.cpp's and ggml's log lines to the `log` crate (audiocpp::logging::route_to_log).
log = ["dep:log"]

# BEGIN GENERATED MODEL FEATURES (cargo xtask features)
